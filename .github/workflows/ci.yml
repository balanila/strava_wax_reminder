name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t chain-wax-bot:test .

      - name: Create dummy compose env file
        run: |
          cat > .env <<EOF
          STRAVA_CLIENT_ID=dummy
          STRAVA_CLIENT_SECRET=dummy
          STRAVA_REFRESH_TOKEN=dummy
          STRAVA_ATHLETE_ID=1
          TELEGRAM_BOT_TOKEN=dummy
          TELEGRAM_CHAT_ID=1
          CHECK_TIME=10:00
          DEFAULT_INTERVAL_KM=500
          TZ=Europe/Chisinau
          DATA_DIR=./data
          PUID=1000
          PGID=1000
          EOF

      - name: Validate docker compose config
        run: docker compose config

  deploy:
    name: Deploy to home server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, linux-nas]
    environment: deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create production env file from GitHub Actions values
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_ATHLETE_ID: ${{ secrets.STRAVA_ATHLETE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_TIME: ${{ vars.CHECK_TIME || '10:00' }}
          DEFAULT_INTERVAL_KM: ${{ vars.DEFAULT_INTERVAL_KM || '500' }}
          TZ: ${{ vars.TZ || 'Europe/Chisinau' }}
          DATA_DIR: ${{ vars.DATA_DIR }}
        run: |
          DATA_DIR="${DATA_DIR:-$HOME/chain-wax-bot-data}"
          PUID="$(id -u)"
          PGID="$(id -g)"
          mkdir -p "$DATA_DIR"
          chmod 700 "$DATA_DIR"
          cat > .env <<EOF
          STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
          STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
          STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN}
          STRAVA_ATHLETE_ID=${STRAVA_ATHLETE_ID}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          CHECK_TIME=${CHECK_TIME}
          DEFAULT_INTERVAL_KM=${DEFAULT_INTERVAL_KM}
          TZ=${TZ}
          DATA_DIR=${DATA_DIR}
          PUID=${PUID}
          PGID=${PGID}
          EOF
          chmod 600 .env

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          docker compose ps
